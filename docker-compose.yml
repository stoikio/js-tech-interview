services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stoik
      POSTGRES_PASSWORD: stoik
      POSTGRES_DB: stoik_lite
    ports:
      # POSTGRES_PORT comes from the root .env, written by scripts/setup-env.mjs.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stoik -d stoik_lite']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
